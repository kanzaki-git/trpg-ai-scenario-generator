<!doctype html>

<html lang="ja">
  <head>
    <title>リクエストを処理できませんでした（400）</title>

    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="/error.css">
  </head>

  <body>
    <main
      class="error-card"
      aria-labelledby="error-title"
    >
      <p class="app-name">
        TRPG AIシナリオジェネレーター

      <p class="status-code" aria-hidden="true">

        リクエストを処理できませんでした

      <p class="description">
        リクエストの形式に問題があるため、処理できませんでした。<br>

      <div class="actions">
        <a href="/" class="button">
          トップページへ戻る
        </a>
      </div>
    </main>

</html>
