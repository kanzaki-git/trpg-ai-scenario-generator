<!doctype html>

<html lang="ja">
  <head>
    <title>一時的なエラーが発生しました（500）</title>

    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="/error.css">
  </head>

  <body>
    <main
      class="error-card"
      aria-labelledby="error-title"
    >
      <p class="app-name">
        TRPG AIシナリオジェネレーター
      </p>

      <p class="status-code" aria-hidden="true">
        500
      </p>

      <h1 id="error-title">
        一時的なエラーが発生しました
      </h1>

      <p class="description">
        申し訳ありません。現在、リクエストを正常に処理できませんでした。
        時間をおいてから、もう一度お試しください。
      </p>

      <div class="actions">
        <a href="/" class="button">
          トップページへ戻る
        </a>
      </div>
    </main>
  </body>
</html>
