<!doctype html>

<html lang="ja">
  <head>
    <title>お探しのページが見つかりません（404）</title>

    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="/error.css">
  </head>

  <body>
    <main
      class="error-card"
      aria-labelledby="error-title"
    >
      <p class="app-name">
        TRPG AIシナリオジェネレーター
      </p>

      <p class="status-code" aria-hidden="true">
        404
      </p>

      <h1 id="error-title">
        お探しのページが見つかりません
      </h1>

      <p class="description">
        入力したURLが間違っているか、ページが移動または削除された可能性があります。
        URLをご確認いただくか、トップページから目的のページをお探しください。
      </p>

      <div class="actions">
        <a href="/" class="button">
          トップページへ戻る
        </a>
      </div>
    </main>
  </body>
</html>
